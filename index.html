<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b0d">
<title>Drum Tuner – Test Version</title>
<style>
  :root {
    --bg: #0b0b0d; --panel: #16161a; --line: #26262c; --text: #f2f2f4; --dim: #8a8a94;
    --green: #34c77b; --amber: #f2a93b; --red: #ef5350; --accent: #e8e8ec; --sel: #5b8cff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  body { padding: env(safe-area-inset-top) 14px calc(env(safe-area-inset-bottom) + 14px); max-width: 520px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 12px 0 8px; }
  .logo { width: 30px; height: 30px; border-radius: 8px; border: 1px dashed var(--dim); display: grid; place-items: center; font-size: 10px; color: var(--dim); }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 0 10px; flex: 1; }
  button, select, input { font: inherit; color: var(--text); }
  button { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; cursor: pointer; }
  button:active { opacity: .7; }
  button.primary { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
  button.on { background: var(--text); color: #000; }
  .row { display: flex; gap: 8px; align-items: center; }
  .scroll { overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .scroll::-webkit-scrollbar { display: none; }
  .chip { white-space: nowrap; border-radius: 999px; padding: 7px 14px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-top: 10px; }
  .readout { text-align: center; padding: 16px 12px 12px; }
  .hz { font-size: 56px; font-weight: 700; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
  .hz small { font-size: 20px; color: var(--dim); font-weight: 500; }
  .note { font-size: 20px; color: var(--dim); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .diff { margin-top: 6px; font-size: 15px; min-height: 20px; font-weight: 600; }
  .seg { display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .seg button { flex: 1; border: 0; background: transparent; padding: 7px; border-radius: 8px; color: var(--dim); }
  .seg button.on { background: var(--panel); color: var(--text); border: 1px solid var(--line); }
  .meter { height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; flex: 1; position: relative; }
  .meter i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--green); transition: width .05s; }
  .meter b { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--text); }
  label { color: var(--dim); font-size: 13px; }
  input[type=range] { flex: 1; accent-color: var(--text); }
  input[type=number] { width: 80px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px; }
  svg { display: block; margin: 0 auto; max-width: 100%; touch-action: manipulation; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; margin-top: 6px; }
  .stats div { background: var(--bg); border-radius: 10px; padding: 8px 4px; }
  .stats b { display: block; font-size: 17px; font-variant-numeric: tabular-nums; }
  .stats span { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .5px; }
  .advice { text-align: center; min-height: 22px; margin: 6px 0 2px; font-weight: 600; }
  .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .status { text-align: center; color: var(--dim); font-size: 13px; min-height: 18px; margin-top: 6px; }
  #start { width: 100%; padding: 16px; font-size: 17px; margin-top: 10px; }
  .legend { display: flex; justify-content: center; gap: 12px; font-size: 12px; color: var(--dim); margin-top: 4px; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
  .muted { color: var(--dim); font-size: 12px; text-align: center; margin-top: 14px; }
</style>
</head>
<body>
<header>
  <div class="logo">LOGO</div>
  <h1>Drum Tuner <span style="color:var(--dim);font-weight:400">· test</span></h1>
  <button id="settingsBtn" aria-label="Drum settings">Edit</button>
</header>

<div class="row scroll" id="drums"></div>

<button id="start" class="primary">Tap to start microphone</button>

<div class="panel readout">
  <div class="hz" id="hz">—<small> Hz</small></div>
  <div class="note" id="note">&nbsp;</div>
  <div class="diff" id="diff"></div>
  <div class="status" id="status">Mic is off</div>
</div>

<div class="panel">
  <div class="seg" id="mode">
    <button data-mode="lug" class="on">Lug pitch</button>
    <button data-mode="fund">Fundamental</button>
  </div>
  <div class="row" style="margin-top:12px">
    <label style="width:74px">Input</label>
    <div class="meter"><i id="lvl"></i><b id="thr"></b></div>
  </div>
  <div class="row" style="margin-top:10px">
    <label style="width:74px">Sensitivity</label>
    <input type="range" id="sens" min="0" max="100" value="60">
  </div>
</div>

<div class="panel">
  <svg id="ring" viewBox="0 0 300 300" width="300" height="300"></svg>
  <div class="legend"><span><i style="background:var(--green)"></i>≤1%</span><span><i style="background:var(--amber)"></i>1–3%</span><span><i style="background:var(--red)"></i>&gt;3%</span><span id="refLabel"></span></div>
  <div class="advice" id="advice"></div>
  <div class="stats">
    <div><b id="avg">—</b><span>Average</span></div>
    <div><b id="spread">—</b><span>Spread</span></div>
    <div><b id="tgt">—</b><span>Target</span></div>
  </div>
  <div class="actions">
    <button id="undo">Undo</button>
    <button id="clear">Clear</button>
    <button id="useAvg">Avg → target</button>
  </div>
</div>

<div class="panel" id="settings" hidden>
  <div class="row"><label style="width:90px">Name</label><input id="sName" style="flex:1;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px"></div>
  <div class="row" style="margin-top:8px"><label style="width:90px">Lugs</label><input type="number" id="sLugs" min="4" max="16" step="1"></div>
  <div class="row" style="margin-top:8px"><label style="width:90px">Target Hz</label><input type="number" id="sTarget" min="0" max="2000" step="0.1" placeholder="none"><label>blank = use median</label></div>
  <div class="actions">
    <button id="addDrum">+ Add drum</button>
    <button id="delDrum">Delete drum</button>
    <button id="closeSettings" class="primary">Done</button>
  </div>
</div>

<p class="muted"><b style="color:var(--text)">Version 3</b> · Test version. Everything stays on this phone — nothing is uploaded.</p>

<script>
'use strict';
// ---------------------------------------------------------------------------
// DSP — this is the exact method the native iOS app will port to Swift/vDSP.
// ---------------------------------------------------------------------------
const DSP = {
  MIN_HZ: 35, MAX_HZ: 1200,
  ATTACK_SKIP_MS: 30,     // skip this long after the loudest point of the hit
  WINDOW_MS: 400,         // analyse this much of the ring after the attack
  FUND_RANGE_DB: 12,      // "Fundamental": lowest peak within 12 dB of the max
  FFT_SIZE: 65536,        // zero-padded => ~0.7 Hz bins at 48 kHz

  // In-place iterative radix-2 FFT.
  fft(re, im) {
    const n = re.length;
    for (let i = 1, j = 0; i < n; i++) {
      let bit = n >> 1;
      for (; j & bit; bit >>= 1) j ^= bit;
      j ^= bit;
      if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; }
    }
    for (let len = 2; len <= n; len <<= 1) {
      const ang = -2 * Math.PI / len, wr = Math.cos(ang), wi = Math.sin(ang);
      for (let i = 0; i < n; i += len) {
        let cr = 1, ci = 0;
        for (let k = 0; k < len / 2; k++) {
          const a = i + k, b = a + len / 2;
          const tr = re[b] * cr - im[b] * ci, ti = re[b] * ci + im[b] * cr;
          re[b] = re[a] - tr; im[b] = im[a] - ti; re[a] += tr; im[a] += ti;
          const ncr = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = ncr;
        }
      }
    }
  },

  // Returns { hz, peaks } or null. mode: 'lug' | 'fund'
  analyze(seg, sr, mode) {
    const N = this.FFT_SIZE, re = new Float64Array(N), im = new Float64Array(N);
    const L = Math.min(seg.length, N);
    let mean = 0; for (let i = 0; i < L; i++) mean += seg[i]; mean /= L;
    for (let i = 0; i < L; i++) re[i] = (seg[i] - mean) * (0.5 - 0.5 * Math.cos(2 * Math.PI * i / (L - 1))); // Hann
    this.fft(re, im);
    const binHz = sr / N;
    const lo = Math.max(2, Math.floor(this.MIN_HZ / binHz)), hi = Math.min(N / 2 - 2, Math.ceil(this.MAX_HZ / binHz));
    const db = new Float64Array(hi + 2);
    for (let k = lo - 1; k <= hi + 1; k++) db[k] = 10 * Math.log10(re[k] * re[k] + im[k] * im[k] + 1e-20);
    // local maxima
    const peaks = [];
    let maxDb = -Infinity;
    for (let k = lo; k <= hi; k++) {
      if (db[k] > db[k - 1] && db[k] >= db[k + 1]) {
        peaks.push(k);
        if (db[k] > maxDb) maxDb = db[k];
      }
    }
    if (!peaks.length) return null;
    let k;
    if (mode === 'fund') {
      k = peaks.find(p => db[p] >= maxDb - this.FUND_RANGE_DB && this.isProminent(db, p, lo, hi));
      if (k === undefined) k = peaks.find(p => db[p] === maxDb);
    } else {
      k = peaks.find(p => db[p] === maxDb);
    }
    // parabolic interpolation on dB magnitudes
    const a = db[k - 1], b = db[k], c = db[k + 1], d = a - 2 * b + c;
    const p = d === 0 ? 0 : 0.5 * (a - c) / d;
    return { hz: (k + p) * binHz, db: b, maxDb };
  },

  // ignore tiny ripples on the skirt of a big peak: require ~3 dB dip within ±8 Hz on both sides
  isProminent(db, k, lo, hi) {
    const span = Math.max(3, Math.round(8 / (48000 / this.FFT_SIZE)));
    let left = db[k], right = db[k];
    for (let i = k - 1; i >= Math.max(lo, k - span); i--) left = Math.min(left, db[i]);
    for (let i = k + 1; i <= Math.min(hi, k + span); i++) right = Math.min(right, db[i]);
    return db[k] - left >= 3 && db[k] - right >= 3;
  },
};
window.DSP = DSP;

// ---------------------------------------------------------------------------
// Music helpers
// ---------------------------------------------------------------------------
const NOTES = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];
function noteOf(hz) {
  const m = 69 + 12 * Math.log2(hz / 440), r = Math.round(m);
  return { name: NOTES[(r % 12 + 12) % 12] + (Math.floor(r / 12) - 1), cents: Math.round((m - r) * 100) };
}
const median = a => { if (!a.length) return 0; const s = [...a].sort((x, y) => x - y), h = s.length >> 1; return s.length % 2 ? s[h] : (s[h - 1] + s[h]) / 2; };
const fmt = (hz, d = 1) => hz ? hz.toFixed(d) : '—';

// ---------------------------------------------------------------------------
// State (saved in localStorage)
// ---------------------------------------------------------------------------
const KEY = 'drumTuner.v1';
const defaults = () => ({
  mode: 'lug', sens: 60, current: 0,
  drums: [
    ['Kick', 10], ['Snare', 10], ['Tom 1', 6], ['Tom 2', 6], ['Floor', 8],
  ].map(([name, lugs]) => ({ name, lugs, target: 0, readings: Array(lugs).fill(0), selected: 0, history: [] })),
});
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || defaults(); } catch { S = defaults(); }
const save = () => localStorage.setItem(KEY, JSON.stringify(S));
const drum = () => S.drums[S.current];

// ---------------------------------------------------------------------------
// UI
// ---------------------------------------------------------------------------
const $ = id => document.getElementById(id);
function colorFor(hz, ref) {
  if (!hz || !ref) return null;
  const pct = Math.abs(hz - ref) / ref * 100;
  return pct <= 1 ? 'var(--green)' : pct <= 3 ? 'var(--amber)' : 'var(--red)';
}
function reference(d) {
  const vals = d.readings.filter(Boolean);
  return d.target > 0 ? { hz: d.target, kind: 'target' } : vals.length >= 2 ? { hz: median(vals), kind: 'median' } : { hz: 0, kind: '' };
}

function renderDrums() {
  $('drums').innerHTML = '';
  S.drums.forEach((d, i) => {
    const b = document.createElement('button');
    b.className = 'chip' + (i === S.current ? ' on' : '');
    b.textContent = d.name;
    b.onclick = () => { S.current = i; save(); renderAll(); };
    $('drums').appendChild(b);
  });
}

function renderRing() {
  const d = drum(), ref = reference(d), n = d.lugs, svg = $('ring');
  const cx = 150, cy = 150, R = 112, r = n > 12 ? 17 : 21;
  let html = `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#26262c" stroke-width="2"/>`;
  html += `<text x="${cx}" y="${cy - 6}" text-anchor="middle" fill="#f2f2f4" font-size="22" font-weight="700">${d.name}</text>`;
  html += `<text x="${cx}" y="${cy + 18}" text-anchor="middle" fill="#8a8a94" font-size="13">${d.readings.filter(Boolean).length}/${n} lugs read</text>`;
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + i * 2 * Math.PI / n, x = cx + R * Math.cos(a), y = cy + R * Math.sin(a);
    const hz = d.readings[i], col = colorFor(hz, ref.hz) || '#16161a', sel = i === d.selected;
    html += `<g data-lug="${i}" style="cursor:pointer">
      <circle cx="${x}" cy="${y}" r="${r + 6}" fill="transparent"/>
      <circle cx="${x}" cy="${y}" r="${r}" fill="${col}" stroke="${sel ? '#5b8cff' : '#3a3a42'}" stroke-width="${sel ? 4 : 1.5}"/>
      <text x="${x}" y="${y + 4}" text-anchor="middle" font-size="${hz ? 11 : 12}" font-weight="600" fill="${hz ? '#000' : '#8a8a94'}">${hz ? Math.round(hz) : i + 1}</text></g>`;
  }
  svg.innerHTML = html;
  svg.querySelectorAll('[data-lug]').forEach(g => g.onclick = () => { d.selected = +g.dataset.lug; save(); renderRing(); renderStats(); });
}

function renderStats() {
  const d = drum(), vals = d.readings.filter(Boolean), ref = reference(d);
  const avg = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0;
  $('avg').textContent = vals.length ? fmt(avg) : '—';
  $('spread').textContent = vals.length > 1 ? fmt(Math.max(...vals) - Math.min(...vals)) + ' Hz' : '—';
  $('tgt').textContent = d.target ? fmt(d.target) : 'median';
  $('refLabel').textContent = ref.kind ? `vs ${ref.kind}` : '';
  // advice for the selected lug, or the most recent reading
  const idx = d.history.length ? d.history[d.history.length - 1].lug : d.selected, hz = d.readings[idx];
  let adv = '';
  if (hz && ref.hz) {
    const pct = (hz - ref.hz) / ref.hz * 100;
    adv = Math.abs(pct) <= 1 ? `Lug ${idx + 1}: in tune` : `Lug ${idx + 1}: ${pct < 0 ? 'tighten ↑' : 'loosen ↓'} (${pct > 0 ? '+' : ''}${pct.toFixed(1)}%)`;
    $('advice').style.color = colorFor(hz, ref.hz);
  }
  $('advice').textContent = adv;
}

function renderReadout(hz) {
  if (!hz) { $('hz').innerHTML = '—<small> Hz</small>'; $('note').innerHTML = '&nbsp;'; $('diff').textContent = ''; return; }
  const n = noteOf(hz);
  $('hz').innerHTML = `${hz.toFixed(1)}<small> Hz</small>`;
  $('note').textContent = `${n.name}  ${n.cents >= 0 ? '+' : ''}${n.cents}¢`;
  const ref = reference(drum());
  if (ref.hz) {
    const dHz = hz - ref.hz, pct = dHz / ref.hz * 100;
    $('diff').textContent = `${dHz >= 0 ? '+' : ''}${dHz.toFixed(1)} Hz (${pct >= 0 ? '+' : ''}${pct.toFixed(1)}%) vs ${ref.kind}`;
    $('diff').style.color = colorFor(hz, ref.hz);
  } else $('diff').textContent = '';
}

function renderControls() {
  document.querySelectorAll('#mode button').forEach(b => b.classList.toggle('on', b.dataset.mode === S.mode));
  $('sens').value = S.sens;
  $('thr').style.left = Math.max(0, Math.min(100, (thresholdDb() + 85) / 80 * 100)) + '%';
}

function renderAll() { renderDrums(); renderRing(); renderStats(); renderControls(); renderReadout(0); if (!$('settings').hidden) fillSettings(); }

// Recording a reading
function record(hz) {
  const d = drum(), lug = d.selected;
  d.history.push({ lug, prev: d.readings[lug], prevSel: d.selected });
  d.readings[lug] = Math.round(hz * 10) / 10;
  d.selected = (lug + 1) % d.lugs;      // auto-advance
  save(); renderRing(); renderStats(); renderReadout(hz);
}

$('undo').onclick = () => {
  const d = drum(), h = d.history.pop(); if (!h) return;
  d.readings[h.lug] = h.prev; d.selected = h.lug; save(); renderRing(); renderStats(); renderReadout(0);
};
// Tap once to arm, tap again within 3 s to confirm. (System pop-ups pause the mic on iPhone.)
function confirmTap(btn, label, action) {
  const original = btn.textContent;
  btn.onclick = () => {
    if (btn.dataset.armed) { clearTimeout(+btn.dataset.armed); delete btn.dataset.armed; btn.textContent = original; btn.style.color = ''; action(); return; }
    btn.textContent = label; btn.style.color = 'var(--red)';
    btn.dataset.armed = setTimeout(() => { delete btn.dataset.armed; btn.textContent = original; btn.style.color = ''; }, 3000);
  };
}
confirmTap($('clear'), 'Tap to confirm', () => {
  const d = drum(); d.readings = Array(d.lugs).fill(0); d.history = []; d.selected = 0; save(); renderAll(); resetDetector();
  if (ctx) $('status').textContent = `Cleared. Hit lug 1 when ready.`;
});
$('useAvg').onclick = () => {
  const vals = drum().readings.filter(Boolean); if (!vals.length) return;
  drum().target = Math.round(vals.reduce((a, b) => a + b, 0) / vals.length * 10) / 10; save(); renderAll();
};
document.querySelectorAll('#mode button').forEach(b => b.onclick = () => { S.mode = b.dataset.mode; save(); renderControls(); });
$('sens').oninput = e => { S.sens = +e.target.value; save(); renderControls(); };

// Settings
function fillSettings() { const d = drum(); $('sName').value = d.name; $('sLugs').value = d.lugs; $('sTarget').value = d.target || ''; }
$('settingsBtn').onclick = () => { $('settings').hidden = !$('settings').hidden; fillSettings(); if (!$('settings').hidden) $('settings').scrollIntoView({ behavior: 'smooth' }); };
$('closeSettings').onclick = () => { $('settings').hidden = true; };
$('sName').onchange = e => { drum().name = e.target.value.trim() || 'Drum'; save(); renderAll(); };
$('sLugs').onchange = e => {
  const d = drum(), n = Math.max(4, Math.min(16, Math.round(+e.target.value) || d.lugs));
  d.readings = Array.from({ length: n }, (_, i) => d.readings[i] || 0); d.lugs = n; d.selected = Math.min(d.selected, n - 1); d.history = [];
  save(); renderAll();
};
$('sTarget').onchange = e => { drum().target = Math.max(0, +e.target.value || 0); save(); renderAll(); };
$('addDrum').onclick = () => {
  const name = 'Drum ' + (S.drums.length + 1);
  S.drums.push({ name, lugs: 6, target: 0, readings: Array(6).fill(0), selected: 0, history: [] });
  S.current = S.drums.length - 1; save(); renderAll();
  $('sName').focus(); $('sName').select();
};
confirmTap($('delDrum'), 'Tap to delete', () => {
  if (S.drums.length <= 1) return;
  S.drums.splice(S.current, 1); S.current = 0; save(); renderAll();
});

// ---------------------------------------------------------------------------
// Audio. Every incoming sample goes into a 3-second ring buffer. A hit is a
// sudden jump in level (works even while the previous hit is still ringing).
// The "jump" is measured on the high-frequency click of the stick, so the low
// ring of a floor tom or kick can't hide the next hit.
// Each hit is measured from just after its attack until 400 ms later, or until
// the next hit starts — whichever comes first.
// ---------------------------------------------------------------------------
const HIT = {
  BLOCK_MS: 5,          // level is measured in 5 ms blocks
  JUMP_DB: 9,           // a new hit = this much louder than ~20 ms earlier
  MIN_GAP_MS: 120,      // ignore stick bounce / attack wobble
  MIN_RING_MS: 250,     // need at least this much clean ring to trust a reading
};
let ctx, stream, proc, sink, ring, ringSize, total = 0, looping = false;
let blockAcc = 0, clickAcc = 0, prevSample = 0, blockN = 0, blockSize = 240, clicks = [], lastOnset = -1e12, pending = null, levelDb = -100;
const thresholdDb = () => -20 - S.sens * 0.4;   // slider 0..100 -> -20 .. -60 dBFS

function resetDetector() { pending = null; lastOnset = -1e12; clicks = []; }

async function startMic() {
  try {
    if (ctx) { try { await ctx.close(); } catch {} }
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    await ctx.resume();
    const sr = ctx.sampleRate;
    ringSize = Math.round(sr * 3); ring = new Float32Array(ringSize); total = 0;
    blockSize = Math.round(sr * HIT.BLOCK_MS / 1000); blockAcc = 0; blockN = 0;
    const src = ctx.createMediaStreamSource(stream);
    proc = ctx.createScriptProcessor(2048, 1, 1);
    sink = ctx.createGain(); sink.gain.value = 0;          // processor must be connected to run; keep it silent
    proc.onaudioprocess = e => onSamples(e.inputBuffer.getChannelData(0));
    src.connect(proc); proc.connect(sink); sink.connect(ctx.destination);
    resetDetector();
    $('start').hidden = true;
    $('status').textContent = `Listening. Hit lug ${drum().selected + 1} about 3 cm from the edge.`;
    if (!looping) { looping = true; requestAnimationFrame(loop); }
  } catch (err) {
    $('status').textContent = 'Microphone blocked: ' + err.message + '. Allow mic access in Settings › Safari.';
  }
}
$('start').onclick = startMic;

function onSamples(x) {
  const sr = ctx.sampleRate;
  for (let i = 0; i < x.length; i++) {
    const v = x[i];
    ring[total % ringSize] = v; total++;
    const d = v - prevSample; prevSample = v;     // simple high-pass: keeps the stick click, drops the low ring
    blockAcc += v * v; clickAcc += d * d;
    if (++blockN === blockSize) {
      const db = 10 * Math.log10(blockAcc / blockN + 1e-18);
      const click = 10 * Math.log10(clickAcc / blockN + 1e-18);
      blockAcc = 0; clickAcc = 0; blockN = 0; levelDb = db;
      clicks.push(click); if (clicks.length > 8) clicks.shift();
      const before = clicks.length === 8 ? Math.max(clicks[0], clicks[1], clicks[2], clicks[3]) : 0;  // ~20–40 ms ago
      const gapOk = total - lastOnset > sr * HIT.MIN_GAP_MS / 1000;
      if (db >= thresholdDb() && click - before >= HIT.JUMP_DB && gapOk) onHit(total - blockSize);
    }
  }
  if (pending && total >= pending.due) finishHit(total);
}

function onHit(onset) {
  const sr = ctx.sampleRate;
  if (pending) finishHit(onset - Math.round(sr * 0.01));   // previous hit got cut short by this one
  lastOnset = onset;
  pending = { onset, due: onset + Math.round(sr * (0.06 + DSP.ATTACK_SKIP_MS / 1000 + DSP.WINDOW_MS / 1000)) };
  $('status').textContent = 'Hit detected… listening to the ring';
  flash();
}

function finishHit(endAbs) {
  const sr = ctx.sampleRate, h = pending; pending = null;
  const avail = Math.min(endAbs, total) - h.onset;
  const raw = new Float32Array(Math.max(0, avail));
  for (let i = 0; i < raw.length; i++) raw[i] = ring[(h.onset + i) % ringSize];
  // end of the stick attack = loudest point in the first 60 ms
  let peakIdx = 0, peak = 0;
  for (let i = 0; i < Math.min(raw.length, sr * 0.06); i++) { const a = Math.abs(raw[i]); if (a > peak) { peak = a; peakIdx = i; } }
  const from = peakIdx + Math.round(sr * DSP.ATTACK_SKIP_MS / 1000);
  const seg = raw.subarray(from, Math.min(raw.length, from + Math.round(sr * DSP.WINDOW_MS / 1000)));
  const lug = drum().selected + 1;
  if (seg.length < sr * HIT.MIN_RING_MS / 1000) {
    $('status').textContent = `Too quick — let it ring a moment. Hit lug ${lug} again.`;
    return;
  }
  setTimeout(() => {      // run the FFT outside the audio callback
    const res = DSP.analyze(seg, sr, S.mode);
    if (!res) { $('status').textContent = `Couldn't read that — hit lug ${lug} again.`; return; }
    record(res.hz);
    $('status').textContent = `Got it. Now hit lug ${drum().selected + 1}.`;
  }, 0);
}

function flash() {
  const el = $('hz'); el.style.transition = 'none'; el.style.opacity = '0.35';
  requestAnimationFrame(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '1'; });
}

// iPhone can pause the mic (phone call, Siri, switching apps, pop-ups). Bring it back.
async function ensureMic() {
  if (!ctx) return;
  const trackDead = !stream || stream.getAudioTracks().every(t => t.readyState === 'ended');
  if (trackDead || ctx.state === 'closed') return startMic();
  if (ctx.state !== 'running') { try { await ctx.resume(); } catch {} resetDetector(); }
}
document.addEventListener('pointerdown', ensureMic, true);
document.addEventListener('visibilitychange', () => { if (!document.hidden) ensureMic(); });

// Screen updates only (detection happens in onSamples).
function loop() {
  requestAnimationFrame(loop);
  const paused = ctx.state !== 'running' || stream.getAudioTracks().every(t => t.readyState === 'ended');
  if (paused) {
    if ($('start').hidden) { $('start').hidden = false; $('start').textContent = 'Mic paused — tap to resume'; $('status').textContent = 'Microphone paused by the phone'; }
    $('lvl').style.width = '0%'; return;
  }
  if (!$('start').hidden) { $('start').hidden = true; $('status').textContent = `Listening. Hit lug ${drum().selected + 1}.`; }
  const thr = thresholdDb();
  $('lvl').style.width = Math.max(0, Math.min(100, (levelDb + 85) / 80 * 100)) + '%';
  $('lvl').style.background = levelDb >= thr ? 'var(--amber)' : 'var(--green)';
  $('thr').style.left = Math.max(0, Math.min(100, (thr + 85) / 80 * 100)) + '%';
}

renderAll();
</script>
</body>
</html>
